<script>
function toggleSidebar() {
    var sidebar = document.getElementById('app-sidebar') || document.querySelector('.sidebar');
    if (sidebar) {
        sidebar.classList.add('animate-sidebar');
        sidebar.classList.toggle('collapsed');
        try {
            localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed') ? 'true' : 'false');
        } catch(e) {}
    }
}
</script>
